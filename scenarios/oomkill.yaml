apiVersion: v1
kind: Pod
metadata:
  name: oomkill-demo
  namespace: sre-lab
  labels:
    app: oomkill-demo
spec:
  restartPolicy: Always
  containers:
    - name: memory-hog
      image: python:3.12-alpine
      command:
        - /bin/sh
        - -c
        - |
          python - <<'PY'
          import time
          x = []
          while True:
              x.append("X" * 1024 * 1024)
              time.sleep(0.05)
          PY
      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"
        limits:
          memory: "64Mi"
          cpu: "200m"
