apiVersion: batch/v1
kind: Job
metadata:
  name: completed-job
  namespace: sre-lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "echo 'job completed successfully'; exit 0"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hourly-cleanup
  namespace: sre-lab
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "echo 'cronjob run completed'"]
